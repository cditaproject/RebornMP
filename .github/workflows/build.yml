name: Build EntityMP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================================================
  # BUILD CLIENT DLL (Windows x86_64)
  # ========================================================================
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Client DLL
        run: |
          cd client
          cargo build --release
          echo "Build complete. Looking for DLL..."
          dir target\release\*.dll
        shell: cmd
      
      - name: Upload Client DLL
        uses: actions/upload-artifact@v4
        with:
          name: client-dll
          path: client/target/release/*.dll
          if-no-files-found: warn

  # ========================================================================
  # BUILD LAUNCHER (Windows x86_64)
  # ========================================================================
  build-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Launcher
        run: |
          cd launcher
          cargo build --release
          echo "Build complete. Looking for EXE..."
          dir target\release\*.exe
        shell: cmd
      
      - name: Upload Launcher
        uses: actions/upload-artifact@v4
        with:
          name: entitymp-launcher
          path: launcher/target/release/*.exe
          if-no-files-found: warn

  # ========================================================================
  # BUILD SHARED LIBRARY (Linux)
  # ========================================================================
  build-shared:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Shared Library
        run: |
          cd shared
          cargo build --release
          ls -la target/release/*.a
      
      - name: Upload Shared Library
        uses: actions/upload-artifact@v4
        with:
          name: shared-lib
          path: shared/target/release/*.a
          if-no-files-found: warn

  # ========================================================================
  # BUILD SDK LIBRARY (Linux)
  # ========================================================================
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build SDK Library
        run: |
          cd sdk
          cargo build --release
          ls -la target/release/*.a
      
      - name: Upload SDK Library
        uses: actions/upload-artifact@v4
        with:
          name: sdk-lib
          path: sdk/target/release/*.a
          if-no-files-found: warn

  # ========================================================================
  # BUILD SERVER CORE (Linux)
  # ========================================================================
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential
      
      - name: Build Server Core
        run: |
          cd server/core
          cargo build --release
          ls -la target/release/*.a
      
      - name: Upload Server Core
        uses: actions/upload-artifact@v4
        with:
          name: server-core-lib
          path: server/core/target/release/*.a
          if-no-files-found: warn

  # ========================================================================
  # CHECK FORMATTING (Linux)
  # ========================================================================
  check-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: |
          cargo fmt --all -- --check || echo "Formatting issues found"
        continue-on-error: true
