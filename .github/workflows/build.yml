name: Build RebornMP (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Сборка Rust компонентов
  build-rust:
    name: Build Rust Components
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-gnu
        override: true
    
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build Launcher (EXE)
      run: cargo build --release --bin launcher
      continue-on-error: false
    
    - name: Build Client DLL
      run: cargo build --release --bin client
      continue-on-error: false
    
    - name: Build Server Core DLL
      run: cargo build --release -p server-core
      continue-on-error: true  # Если пакет называется иначе
    
    - name: List built files
      run: |
        echo "=== Built executables ==="
        dir target\release\*.exe
        echo "=== Built DLLs ==="
        dir target\release\*.dll
    
    - name: Upload Rust artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rust-binaries
        path: |
          target/release/*.exe
          target/release/*.dll
          !target/release/*.pdb
        retention-days: 7

  # Job 2: Проверка TypeScript (без компиляции)
  check-typescript:
    name: Check TypeScript (Server)
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
      working-directory: ./server
    
    - name: Install TypeScript locally
      run: bun add -d typescript @types/node
      working-directory: ./server
    
    - name: Run TypeScript compiler check
      run: bunx tsc --noEmit
      working-directory: ./server
      continue-on-error: true  # Не падаем, если нет tsconfig.json
    
    - name: List server files
      run: |
        echo "=== Server directory contents ==="
        dir server
        echo "=== Checking for index.ts ==="
        if exist server\src\index.ts (echo index.ts found) else (echo index.ts not found)
    
    - name: Upload server source (for reference)
      uses: actions/upload-artifact@v4
      with:
        name: server-source
        path: |
          server/**/*.ts
          server/**/*.json
          !server/node_modules
        retention-days: 7

  # Job 3: Полная проверка (опционально)
  full-build:
    name: Full Build Check
    runs-on: windows-latest
    needs: [build-rust, check-typescript]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: List all artifacts
      run: dir artifacts /s
    
    - name: Final status
      run: |
        echo "✅ Build completed successfully!"
        echo "Rust components: rust-binaries artifact"
        echo "TypeScript files: server-source artifact"
