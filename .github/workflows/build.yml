name: Windows Build (All Modules)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:        # Позволяет запускать вручную из интерфейса GitHub

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------
  # Job 1: Сборка всех Rust-компонентов (клиент, лаунчер, SDK, shared, ядро сервера)
  # --------------------------------------------------
  build-rust:
    name: Build Rust Components (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain (stable, Windows GNU)
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-gnu
        override: true
        profile: minimal

    # Установка дополнительных инструментов (если нужны, например, для привязок)
    - name: Install cargo make (optional for advanced scripts)
      run: cargo install cargo-make
      continue-on-error: true

    # Кэширование зависимостей для ускорения сборки
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build launcher (EXE)
      run: cargo build --release --bin launcher
      working-directory: ./

    - name: Build client DLL (cdylib)
      run: cargo build --release --bin client
      working-directory: ./

    # Серверное ядро собирается как cdylib (для вызова из Bun/Node)
    - name: Build server core (cdylib)
      run: cargo build --release -p rebornmp-server-core
      working-directory: ./

    # shared и sdk — библиотеки, они соберутся как зависимости выше,
    # но можно явно проверить их компиляцию
    - name: Check shared library
      run: cargo check --release -p rebornmp-shared

    - name: Check sdk library
      run: cargo check --release -p rebornmp-sdk

    # Сохранение артефактов сборки
    - name: Upload Rust artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rust-binaries-windows
        path: |
          target/release/launcher.exe
          target/release/client.dll
          target/release/rebornmp_server_core.dll
        retention-days: 7

  # --------------------------------------------------
  # Job 2: Сборка серверной части (TypeScript / Bun)
  # --------------------------------------------------
  build-server-ts:
    name: Build TypeScript Server Part
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies (server)
      run: bun install
      working-directory: ./server

    - name: Type check TypeScript
      run: bun run tsc --noEmit
      working-directory: ./server
      continue-on-error: false

    # Если в package.json определён скрипт сборки (например, "build": "bun build ...")
    - name: Build server JS (if build script exists)
      run: bun run build --if-present
      working-directory: ./server
      continue-on-error: true

    # Сохраняем исходники и скомпилированные файлы как артефакт
    - name: Upload server TS artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-typescript
        path: |
          server/**/*
          !server/node_modules
        retention-days: 7

  # --------------------------------------------------
  # Job 3: (Опционально) Сборка всех компонентов сразу, запуск линтеров и тестов
  # --------------------------------------------------
  full-check:
    name: Full Check (Lint + Test + Build All)
    runs-on: windows-latest
    needs: [build-rust, build-server-ts]  # Зависит от двух предыдущих, но может выполняться параллельно
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-pc-windows-gnu
        override: true
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-full-

    - name: Run rustfmt (check)
      run: cargo fmt --all -- --check

    - name: Run clippy (linter)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Rust tests
      run: cargo test --all

    # Дополнительно — собрать всё вместе (обычно cargo build --release уже сделано, но повторим для проверки)
    - name: Full release build
      run: cargo build --release --workspace

    - name: Setup Bun and check server TS
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    - run: bun install
      working-directory: ./server
    - run: bun run tsc --noEmit
      working-directory: ./server

# --------------------------------------------------
# Примечания:
# 1. Имена пакетов (-p) должны соответствовать тем, что в Cargo.toml.
#    Возможные имена: "rebornmp-client", "rebornmp-launcher", "rebornmp-server-core",
#    "rebornmp-shared", "rebornmp-sdk" — уточните по Cargo.toml каждого модуля.
# 2. Если серверное ядро имеет другое имя (например, "server-core"), поправьте в шаге "Build server core".
# 3. Для запуска только одного модуля используйте workflow_dispatch с choice input (см. расширенную версию ниже).
# --------------------------------------------------
