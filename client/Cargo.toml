[package]
name = "client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
winapi = { version = "0.3", features = [
    "winnt",
    "libloaderapi",
    "winuser",
    "errhandlingapi"
] }
log = "0.4"
simple_logger = "4.2"
anyhow = "1.0"
tungstenite = "0.20"
url = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"