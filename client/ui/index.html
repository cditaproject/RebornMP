<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: transparent; color: white; font-family: Arial; }
        #chat { position: fixed; bottom: 20px; left: 20px; width: 400px; }
        .message { padding: 5px; margin: 2px; background: rgba(0,0,0,0.7); border-radius: 5px; }
        .system { color: #ffaa00; }
        .player { color: #00ff00; }
        #input { position: fixed; bottom: 20px; left: 20px; width: 400px; background: rgba(0,0,0,0.8); border: none; color: white; padding: 5px; display: none; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <input id="input" type="text" placeholder="Type message...">
    <script>
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('input');
        
        window.reborn = {
            addMessage: (text, isSystem) => {
                const msg = document.createElement('div');
                msg.className = 'message ' + (isSystem ? 'system' : 'player');
                msg.textContent = text;
                chatDiv.appendChild(msg);
                chatDiv.scrollTop = chatDiv.scrollHeight;
            },
            showInput: () => { input.style.display = 'block'; input.focus(); },
            hideInput: () => { input.style.display = 'none'; input.value = ''; }
        };
        
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                window.external.sendChat(input.value);
                window.reborn.hideInput();
            }
        });
    </script>
</body>
</html>
