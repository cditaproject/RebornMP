[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3", features = [
    "winnt",
    "handleapi",
    "memoryapi",
    "processthreadsapi",
    "errhandlingapi",
    "synchapi",
    "tlhelp32",
    "libloaderapi"
] }
winreg = "0.52"
anyhow = "1.0"
log = "0.4"
simple_logger = "4.2"
egui = "0.27"
eframe = "0.27"
rfd = "0.14"  # Для диалога выбора файлов
directories = "5.0"  # Для сохранения настроек
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"